<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="left">
        <h1>SkillSync</h1>
        <p class="tagline">Build your team. Build your project.</p>
        <p class="about">Create an account and connect with students based on their skills.</p>
    </div>

    <div class="login-box">

        <h2>Create Account</h2>
        <p class="login-text">Enter your details to get started</p>

        <form onsubmit="createAccount(event)">

            <label>Name</label>
            <input type="text" id="signupName" placeholder="Enter your name" required>

            <label>Role</label>
            <select id="signupRole" required>
                <option value="">Select your role</option>
                <option value="student">Student</option>
                <option value="leader">Team Leader</option>
                <option value="mentor">Mentor</option>
            </select>

            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Enter password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit" class="login-btn">Create Account</button>

        </form>

        <p class="signup">
            Already have an account?
            <a href="index.html">Login</a>
        </p>

    </div>

</div>

<script>
async function createAccount(event) {
    event.preventDefault();

    let name = document.getElementById("signupName").value;
    let role = document.getElementById("signupRole").value;
    let email = document.getElementById("signupEmail").value;
    let password = document.getElementById("signupPassword").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match");
        return;
    }

    try {
        const response = await fetch("http://127.0.0.1:8000/auth/signup", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                role: role,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.detail || "Signup failed");
            return;
        }

        alert("Account created successfully");
        window.location.href = "index.html";

    } catch (error) {
        alert("Unable to connect to the server.");
        console.error(error);
    }
}
</script>

</body>
</html>
