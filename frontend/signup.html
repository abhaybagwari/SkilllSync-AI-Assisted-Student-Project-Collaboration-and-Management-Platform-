<!DOCTYPE html>
<html>
<head>
    <title>SkillSync - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="left">
        <h1>SkillSync</h1>
        <p class="tagline">Build your team. Build your project.</p>
        <p class="about">Create an account and connect with students based on their skills.</p>
    </div>

    <div class="login-box">
        <h2>Create Account</h2>
        <p class="login-text">Enter your details to get started</p>

        <form onsubmit="createAccount(event)">

            <label>Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit" class="login-btn">Create Account</button>

        </form>

        <p class="signup">
            Already have an account?
            <a href="index.html">Login</a>
        </p>
    </div>

</div>

<script>
function createAccount(event) {
    event.preventDefault();

    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (password != confirmPassword) {
        alert("Passwords do not match");
    } else {
        alert("Account created successfully");
    }
}
</script>

</body>
</html>
