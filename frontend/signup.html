 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="left">
        <h1>SkillSync</h1>
        <p class="tagline">Build your team. Build your project.</p>
        <p class="about">Create an account and connect with students based on their skills.</p>
    </div>

    <div class="login-box">
        <h2>Create Account</h2>
        <p class="login-text">Enter your details to get started</p>

        <form id="signupForm">
            <label>Name</label>
            <input type="text" id="signupName" placeholder="Enter your name" required>

            <label>Role</label>
            <select id="signupRole" required>
                <option value="">Select your role</option>
                <option value="student">Student</option>
                <option value="leader">Team Leader</option>
                <option value="mentor">Mentor</option>
            </select>

            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Enter password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit" class="login-btn" id="signupButton">Create Account</button>
            <p id="signupMessage" role="status"></p>
        </form>

        <p class="signup">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</div>

<script>
const signupForm = document.getElementById("signupForm");
const signupButton = document.getElementById("signupButton");
const signupMessage = document.getElementById("signupMessage");

signupForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("signupName").value.trim();
    const role = document.getElementById("signupRole").value;
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!name) {
        signupMessage.textContent = "Please enter your name.";
        return;
    }

    if (password !== confirmPassword) {
        signupMessage.textContent = "Passwords do not match.";
        return;
    }

    signupButton.disabled = true;
    signupMessage.textContent = "Creating your account...";

    try {
        const response = await fetch("http://127.0.0.1:8000/auth/signup", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                role,
                email,
                password
            })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.detail || "Signup failed.");
        }

        const user = data.user;

        if (!user || !user.user_id || !user.role) {
            throw new Error("Invalid user details returned by the server.");
        }

        if (!["Team Member", "Team Leader", "Mentor"].includes(user.role)) {
            throw new Error("Unexpected account role returned by the server.");
        }

        const session = {
            user_id: user.user_id,
            name: user.name,
            email: user.email,
            role: user.role
        };

        // Clear stale session data without deleting saved profiles.
        [
            "userId", "userName", "userEmail",
            "userRole", "role", "skillsyncUser",
            "skillsyncSignup", "skillsync_pending_credentials"
        ].forEach(key => localStorage.removeItem(key));

        localStorage.setItem("skillsyncUser", JSON.stringify(session));
        localStorage.setItem("userId", String(user.user_id));
        localStorage.setItem("userName", user.name);
        localStorage.setItem("userEmail", user.email);
        localStorage.setItem("userRole", user.role);
        localStorage.setItem("role", user.role);

        if (user.role === "Mentor") {
            window.location.href = "mentor-dashboard.html";
        } else {
            localStorage.setItem("skillsyncSignup", JSON.stringify({
                name: user.name,
                email: user.email,
                role: user.role
            }));

            localStorage.setItem("skillsync_pending_credentials", "true");
            window.location.href = "credentials.html";
        }
    } catch (error) {
        signupMessage.textContent = error.message ||
            "Unable to connect to the server.";
        console.error("Signup error:", error);
    } finally {
        signupButton.disabled = false;
    }
});
</script>
</body>
</html>
