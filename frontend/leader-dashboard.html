<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync - Team Leader Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <h2>SkillSync</h2>

        <a href="#">Dashboard</a>
        <a href="#">My Profile</a>
        <a href="#">My Projects</a>
        <a href="#">Find Members</a>
        <a href="#">Team Requests</a>
        <a href="#">Team Members</a>
        <a href="#">Tasks</a>
        <a href="#">Settings</a>

        <a href="index.html" class="logout">Logout</a>

    </div>

    <div class="main-content">

        <h1>Team Leader Dashboard</h1>
        <p class="welcome">Manage your projects, team members and tasks.</p>

        <div class="cards">

            <div class="card">
                <h3>My Projects</h3>
                <p></p>
            </div>

            <div class="card">
                <h3>Team Members</h3>
                <p></p>
            </div>

            <div class="card">
                <h3>Pending Requests</h3>
                <p></p>
            </div>

            <div class="card">
                <h3>Tasks</h3>
                <p></p>
            </div>

        </div>

        <div class="section">

            <h2>My Projects</h2>

            <div class="project">
                <h3></h3>
                <p></p>
                <p class="match"></p>
            </div>

        </div>

        <div class="section">

            <h2>Team Requests</h2>

            <div class="project">
                <h3></h3>
                <p></p>
                <p class="match"></p>
            </div>

        </div>

        <div class="section">

            <h2>Team Tasks</h2>

            <div class="task">
                <span class="status"></span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
