 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSync - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="left">
<h1>SkillSync</h1>
<p class="tagline">Build your team. Build your project.</p>
<p class="about">Login to connect with students and discover projects matching your skills.</p>
</div>

<div class="login-box">
<h2>Welcome Back</h2>
<p class="login-text">Enter your details to log in</p>

<form id="loginForm">
<label for="loginRole">Role</label>
<select id="loginRole" required>
<option value="">Select your role</option>
<option value="student">Student</option>
<option value="leader">Team Leader</option>
<option value="mentor">Mentor</option>
</select>

<label for="loginEmail">Email</label>
<input type="email" id="loginEmail"
    placeholder="Enter your email" required>

<label for="loginPassword">Password</label>
<input type="password" id="loginPassword"
    placeholder="Enter your password" required>

<button type="submit" class="login-btn" id="loginButton">
Login
</button>
</form>

<p id="message" role="status"></p>

<p class="signup">
Don't have an account?
<a href="signup.html">Sign Up</a>
</p>
</div>
</div>
<script src="session.js"></script>
<script>
const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(event) {
event.preventDefault();

const role = document.getElementById("loginRole").value;
const email = document.getElementById("loginEmail").value.trim();
const password = document.getElementById("loginPassword").value;

loginButton.disabled = true;
message.textContent = "Logging in...";

try {
const response = await fetch("http://127.0.0.1:8000/auth/login", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
email,
password,
role
})
});

const data = await response.json().catch(() => ({}));

if (!response.ok) {
throw new Error(data.detail || "Login failed.");
}

const user = data.user;

if (!user || user.user_id == null || !user.role) {
throw new Error("The server returned incomplete user details.");
}

if (!["Team Member", "Team Leader", "Mentor"].includes(user.role)) {
throw new Error("The server returned an unexpected account role.");
}

const session = {
user_id: user.user_id,
name: user.name || "",
email: user.email || email,
role: user.role
};

const sessionKeys = [
"userId",
"userName",
"userEmail",
"userRole",
"role",
"skillsyncUser",
"skillsyncSignup",
"skillsync_pending_credentials"
];

setSession(session);

if (session.role === "Mentor") {
window.location.href = "mentor-dashboard.html";
} else if (session.role === "Team Leader") {
window.location.href = "leader-dashboard.html";
} else {
window.location.href = "student-dashboard.html";
}

} catch (error) {
message.textContent =
error.message || "Unable to connect to the server.";
console.error("Login error:", error);
} finally {
loginButton.disabled = false;
}
});
</script>
</body>
</html>
