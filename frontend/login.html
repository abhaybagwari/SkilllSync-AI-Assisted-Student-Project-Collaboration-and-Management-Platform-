
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="left">
        <h1>SkillSync</h1>
        <p class="tagline">Build your team. Build your project.</p>
        <p class="about">Login to connect with students and discover projects matching your skills.</p>
    </div>

    <div class="login-box">
        <h2>Welcome Back</h2>
        <p class="login-text">Enter your details to log in</p>

        <form id="loginForm">
            <label for="loginRole">Role</label>
            <select id="loginRole" required>
                <option value="">Select your role</option>
                <option value="student">Student</option>
                <option value="leader">Team Leader</option>
                <option value="mentor">Mentor</option>
            </select>

            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="signup">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <p id="message" role="status"></p>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");
    const role = document.getElementById("loginRole").value;
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    message.textContent = "Logging in...";

    try {
        const response = await fetch("http://127.0.0.1:8000/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password,
                role: role
            })
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.detail || "Login failed.";
            return;
        }

       const loggedInUser = data.user;

localStorage.setItem("skillsyncUser", JSON.stringify(loggedInUser));
localStorage.setItem("userId", loggedInUser.user_id);
localStorage.setItem("userRole", loggedInUser.role);

if (loggedInUser.role === "Team Leader") {
    window.location.href = "leader-dashboard.html";
} else if (loggedInUser.role === "Mentor") {
    window.location.href = "mentor-dashboard.html";
} else {
    window.location.href = "student-dashboard.html";
}
    } catch (error) {
        message.textContent = "Unable to connect to the server. Check that the backend is running.";
        console.error(error);
    }
});
</script>

</body>
</html>
