<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync - Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <h2>SkillSync</h2>

        <a href="#">Dashboard</a>
        <a href="#">My Profile</a>
        <a href="#">Find Projects</a>
        <a href="#">My Team</a>
        <a href="#">My Tasks</a>
        <a href="#">Certificates</a>
        <a href="#">Settings</a>

        <a href="index.html" class="logout">Logout</a>

    </div>

    <div class="main-content">

        <h1>Student Dashboard</h1>
        <p class="welcome">Welcome back! Find projects and work with the right team.</p>

        <div class="cards">

            <div class="card">
                <h3>My Projects</h3>
                <p></p>
            </div>

            <div class="card">
                <h3>Team Members</h3>
                <p></p>
            </div>

            <div class="card">
                <h3>Pending Tasks</h3>
                <p></p>
            </div>

            <div class="card">
                <h3>Completed Tasks</h3>
                <p></p>
            </div>

        </div>

        <div class="section">

            <h2>Recommended Projects</h2>

            <div class="project">
                <h3></h3>
                <p></p>
                <p class="match"></p>
            </div>

        </div>

        <div class="section">

            <h2>My Recent Tasks</h2>

            <div class="task">
                <span class="status"></span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
