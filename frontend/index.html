<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <h1>SkillSync</h1>
            <p class="tagline">Find the right team for your project.</p>
            <p class="about">Connect with students who have the skills you need and work together on projects.</p>
        </div>
        <div class="login-box">
            <p class="login-text">Login to continue to SkillSync</p>
            <form onsubmit="login(event)">
                <label>Email ID</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <label>Password</label>
                <div class="password-box">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" onclick="showPassword()">Show</button>
                </div>
                <div class="options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <p class="signup">Don't have an account? <a href="#">Sign Up</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
