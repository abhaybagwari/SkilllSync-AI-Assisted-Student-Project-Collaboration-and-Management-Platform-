<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mentors - SkillSync</title>
<link rel="stylesheet" href="style.css">
<style>
.topbar{background:#4a6fa5;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.topbar h2{margin:0;font-size:20px}
.topbar a{color:white;font-size:14px}
.page{max-width:760px;margin:24px auto;padding:0 16px}
.page h1{font-size:24px;color:#2f4a70;margin-bottom:6px}
.sub{color:#777;margin-bottom:18px;font-size:14px}
.panel{background:white;border-radius:10px;padding:20px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,0.08)}
.item{display:flex;justify-content:space-between;align-items:center;padding:13px 12px;border:1px solid #e3e8ef;border-radius:8px;margin-bottom:10px;cursor:pointer;background:white}
.item:hover{background:#eef3fa}
.tag{font-size:12px;background:#e3ecf8;color:#2f4a70;border-radius:12px;padding:3px 10px}
.tag.lead{background:#4a6fa5;color:white}
.btn{padding:10px 16px;border:none;border-radius:6px;background:#4a6fa5;color:white;font-size:14px;cursor:pointer;margin:6px 8px 0 0}
.btn:hover{background:#3d5d8a}
.btn.light{background:#e3ecf8;color:#2f4a70}
.btn.light:hover{background:#d3e1f4}
.avatar{width:72px;height:72px;border-radius:50%;background:#4a6fa5;color:white;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px}
.review{border-top:1px solid #e3e8ef;padding:12px 0}
.review small{color:#777}
.stars{color:#c98a00;letter-spacing:2px}
.note{background:#f4f7fb;border-radius:8px;padding:12px;color:#555;font-size:14px}
.error{color:#b42318}
.muted{color:#777}
</style>
</head>
<body>
<div class="topbar">
    <h2>SkillSync</h2>
    <a href="login.html">Login</a>
</div>
<div class="page" id="app"></div>

<script>
const API = "http://127.0.0.1:8000";
const viewerId = Number(localStorage.getItem("userId")) || 0;
const app = document.getElementById("app");

function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
}

function fmtDate(v) {
    if (!v) return "";
    const d = new Date(v);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("en-IN", {day: "numeric", month: "short", year: "numeric"});
}

function stars(n) {
    n = Math.round(Number(n) || 0);
    return "★".repeat(n) + "☆".repeat(5 - n);
}

async function api(path) {
    const response = await fetch(API + path);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
        throw new Error(data.detail || "Request failed (" + response.status + ")");
    }
    return data;
}

function loading() {
    app.innerHTML = '<div class="panel muted">Loading...</div>';
}

function fail(error, backCall) {
    app.innerHTML = '<div class="panel"><p class="error">' + esc(error.message) +
        '</p><button class="btn light" onclick="' + backCall + '">Back</button></div>';
}

async function showMentors() {
    loading();
    try {
        const data = await api("/public/mentors");
        const list = data.mentors || [];
        app.innerHTML = '<h1>Mentors</h1><p class="sub">Select a mentor to see the projects they have mentored.</p>' +
            (list.length ? list.map(m =>
                '<div class="item" onclick="showMentor(' + Number(m.User_ID) + ')"><span>' + esc(m.Name) + '</span></div>'
            ).join("") : '<div class="panel">No mentors found.</div>');
    } catch (error) {
        fail(error, "showMentors()");
    }
}

async function showMentor(mid) {
    loading();
    try {
        const data = await api("/public/mentors/" + mid + "/projects");
        app.innerHTML =
            '<h1>' + esc(data.mentor.Name) + '</h1>' +
            '<p class="sub">Mentor</p>' +
            '<div class="panel">' +
            '<p>Projects completed (mentored): <strong>' + Number(data.completed_projects) + '</strong></p>' +
            '<button class="btn" onclick="showProjects(' + mid + ')">View</button>' +
            '<button class="btn light" onclick="showMentors()">Back</button>' +
            '</div>';
    } catch (error) {
        fail(error, "showMentors()");
    }
}

async function showProjects(mid) {
    loading();
    try {
        const data = await api("/public/mentors/" + mid + "/projects");
        const list = data.projects || [];
        app.innerHTML =
            '<h1>' + esc(data.mentor.Name) + '</h1>' +
            '<p class="sub">Completed projects</p>' +
            (list.length ? list.map(p =>
                '<div class="item" onclick="showProject(' + Number(p.Project_ID) + ',' + mid + ')"><span>' +
                esc(p.Project_Name) + '</span><span class="tag">' + esc(fmtDate(p.Completed_At)) + '</span></div>'
            ).join("") : '<div class="panel">No completed projects yet.</div>') +
            '<button class="btn light" onclick="showMentor(' + mid + ')">Back</button>';
    } catch (error) {
        fail(error, "showMentor(" + mid + ")");
    }
}

async function showProject(pid, mid) {
    loading();
    try {
        const data = await api("/public/projects/" + pid);
        const mentorNames = (data.mentors || []).map(m => esc(m.Name)).join(", ") || "Not assigned";
        const review = data.mentor_review;

        let reviewHtml = '<p class="muted">No mentor review yet.</p>';
        if (review) {
            reviewHtml =
                '<p><span class="stars">' + stars(review.average_rating) + '</span> ' +
                esc(review.average_rating) + ' / 5</p>' +
                '<p>' + esc(review.latest.Feedback_Text) + '</p>' +
                '<small class="muted">' + esc(review.latest.Mentor_Name) + ', ' +
                esc(fmtDate(review.latest.Feedback_Date)) + '</small>';
        }

        app.innerHTML =
            '<h1>' + esc(data.project.Project_Name) + '</h1>' +
            '<p class="sub">Completed ' + esc(fmtDate(data.project.Completed_At)) +
            ' &middot; Mentor: ' + mentorNames + '</p>' +
            '<div class="panel"><h3>Team</h3><p class="sub">Click a member to see how they worked in past projects.</p>' +
            (data.team || []).map(t =>
                '<div class="item" onclick="showMirror(' + Number(t.User_ID) + ',' + pid + ',' + mid + ')"><span>' +
                esc(t.Name) + '</span><span class="tag' + (t.Role === "Team Leader" ? ' lead' : '') + '">' +
                esc(t.Role) + '</span></div>'
            ).join("") + '</div>' +
            '<div class="panel"><h3>Mentor review of the team</h3>' + reviewHtml + '</div>' +
            '<button class="btn light" onclick="showProjects(' + mid + ')">Back</button>';
    } catch (error) {
        fail(error, "showProjects(" + mid + ")");
    }
}

async function showMirror(uid, fromPid, mid) {
    loading();
    try {
        const data = await api("/public/members/" + uid + "/mirror");
        const list = data.projects || [];
        app.innerHTML =
            '<div class="panel">' +
            '<div class="avatar">' + esc((data.member.Name || "?").charAt(0).toUpperCase()) + '</div>' +
            '<h1>' + esc(data.member.Name) + '</h1>' +
            '<p class="sub">Completed projects: ' + Number(data.completed_projects) + '</p>' +
            '</div>' +
            (list.length ? list.map(p =>
                '<div class="item" onclick="showMirrorProject(' + uid + ',' + Number(p.Project_ID) + ',' + fromPid + ',' + mid + ')"><span>' +
                esc(p.Project_Name) + '</span><span class="tag' + (p.Role === "Team Leader" ? ' lead' : '') + '">' +
                esc(p.Role) + '</span></div>'
            ).join("") : '<div class="panel muted">No completed projects yet.</div>') +
            '<button class="btn light" onclick="showProject(' + fromPid + ',' + mid + ')">Back</button>';
    } catch (error) {
        fail(error, "showProject(" + fromPid + "," + mid + ")");
    }
}

async function showMirrorProject(uid, pid, fromPid, mid) {
    loading();
    try {
        const data = await api("/public/members/" + uid + "/projects/" + pid + "?viewer_id=" + viewerId);
        const mentorNames = (data.mentors || []).map(m => esc(m.Name)).join(", ") || "Not assigned";

        let reviewsHtml;
        if (data.reviews_hidden) {
            reviewsHtml = '<div class="note">Peer reviews for this project are not shown to its mentor or teammates.</div>';
        } else if ((data.reviews || []).length) {
            reviewsHtml = (data.average_rating !== null
                ? '<p><span class="stars">' + stars(data.average_rating) + '</span> ' + esc(data.average_rating) + ' / 5 average</p>'
                : '') +
                data.reviews.map(r =>
                    '<div class="review">' +
                    '<strong>' + esc(r.Reviewer_Name) + '</strong> <span class="tag' + (r.Reviewer_Role === "Team Leader" ? ' lead' : '') + '">' + esc(r.Reviewer_Role) + '</span>' +
                    '<div><span class="stars">' + stars(r.Rating) + '</span></div>' +
                    '<p>' + esc(r.Comment) + '</p>' +
                    '<small>' + esc(fmtDate(r.Created_At)) +
                    (r.Edited_At ? ' &middot; Last edited on ' + esc(fmtDate(r.Edited_At)) : '') + '</small>' +
                    '</div>'
                ).join("");
        } else {
            reviewsHtml = '<p class="muted">No reviews yet.</p>';
        }

        app.innerHTML =
            '<h1>' + esc(data.member.Name) + '</h1>' +
            '<p class="sub">Worked as ' + esc(data.role) + ' in ' + esc(data.project.Project_Name) + '</p>' +
            '<div class="panel"><p>Mentor: <strong>' + mentorNames + '</strong></p></div>' +
            '<div class="panel"><h3>Reviews from teammates</h3>' + reviewsHtml + '</div>' +
            '<div id="proceedNote"></div>' +
            '<button class="btn" onclick="proceedToProfile(' + uid + ')">Proceed</button>' +
            '<button class="btn light" onclick="showProject(' + fromPid + ',' + mid + ')">Back</button>' +
            '<button class="btn light" onclick="showMirror(' + uid + ',' + fromPid + ',' + mid + ')">All projects</button>';
    } catch (error) {
        fail(error, "showMirror(" + uid + "," + fromPid + "," + mid + ")");
    }
}

function proceedToProfile(uid) {
    if (!viewerId) {
        window.location.href = "login.html";
        return;
    }
    document.getElementById("proceedNote").innerHTML =
        '<div class="note">Full profile view will be added in the next step.</div>';
}

showMentors();
</script>
</body>
</html>
