<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync - Mentor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

        <h2>SkillSync</h2>

        <a href="#">Dashboard</a>
        <a href="#">My Profile</a>
        <a href="#">Projects</a>
        <a href="#">Teams</a>
        <a href="#">Progress</a>
        <a href="#">Feedback</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>

        <a href="index.html" class="logout">Logout</a>

    </div>

    <div class="main-content">

        <h1>Mentor Dashboard</h1>
        <p class="welcome">Monitor student projects and provide guidance.</p>

        <div class="cards">

            <div class="card">
                <h3>Assigned Projects</h3>
                <p></p>
            </div>

            <div class="card">
                <h3>Active Teams</h3>
                <p></p>
            </div>

            <div class="card">
                <h3>Pending Reviews</h3>
                <p></p>
            </div>

            <div class="card">
                <h3>Feedback Given</h3>
                <p></p>
            </div>

        </div>

        <div class="section">

            <h2>Project Monitoring</h2>

            <div class="project">
                <h3></h3>
                <p></p>
                <p class="match"></p>
            </div>

        </div>

        <div class="section">

            <h2>Recent Feedback</h2>

            <div class="task">
                <span class="status"></span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
