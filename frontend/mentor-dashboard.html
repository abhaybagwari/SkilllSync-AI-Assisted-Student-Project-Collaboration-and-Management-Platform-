
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Dashboard - SkillSync</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ef;
            color: #333;
        }

        .sidebar {
            width: 210px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 25px 15px;
            background: #5c4938;
            overflow-y: auto;
        }

        .sidebar h2 {
            color: white;
            margin-bottom: 30px;
        }

        .sidebar button {
            display: block;
            width: 100%;
            padding: 13px 10px;
            margin-bottom: 8px;
            color: white;
            background: transparent;
            border: none;
            border-radius: 5px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
        }

        .sidebar button:hover,
        .sidebar button.active {
            background: #80674f;
        }

        .main {
            margin-left: 210px;
            padding: 30px;
        }

        h1, h3 {
            color: #5c4938;
        }

        .welcome {
            color: #777;
            margin-bottom: 25px;
        }

        .card, .stat-card {
            background: white;
            padding: 22px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px #00000010;
            overflow-x: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .stat-card {
            margin: 0;
        }

        .stat-card h3 {
            font-size: 14px;
            margin-top: 0;
        }

        .stat-card p {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 0;
        }

        .present {
            color: #39804a;
        }

        .absent {
            color: #c44b4b;
        }

        select, textarea {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .submit, .action-button {
            background: #5c4938;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
        }

        .submit:hover, .action-button:hover {
            background: #80674f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 300px;
        }

        th {
            background: #5c4938;
            color: white;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .profile-row {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .message {
            margin-top: 12px;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 150px;
                padding: 15px 8px;
            }

            .sidebar h2 {
                font-size: 18px;
            }

            .sidebar button {
                font-size: 13px;
                padding: 10px 6px;
            }

            .main {
                margin-left: 150px;
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            th, td {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>SkillSync</h2>
        <button class="active" onclick="showPage('Dashboard', this)">Dashboard</button>
        <button onclick="showPage('Projects', this)">Projects</button>
        <button onclick="showPage('Students', this)">Student Teams</button>
        <button onclick="showPage('Feedback', this)">Project Feedback</button>
        <button onclick="showPage('Profile', this)">My Profile</button>
        <button onclick="logout()">Logout</button>
    </div>

    <main class="main" id="content"></main>

    <script>
        const projects = {
            campus: {
                name: "Smart Campus Portal",
                team: "Team 1",
                leader: "Rahul Sharma",
                interaction: "Project Progress Review",
                completed: 5,
                pending: 1,
                members: [
                    { name: "Rahul Sharma", attendance: "Present" },
                    { name: "Aman Verma", attendance: "Absent" },
                    { name: "Priya Singh", attendance: "Present" }
                ]
            },

            library: {
                name: "Library Management System",
                team: "Team 2",
                leader: "Neha Gupta",
                interaction: "Design Discussion",
                completed: 3,
                pending: 1,
                members: [
                    { name: "Neha Gupta", attendance: "Present" },
                    { name: "Arjun Kumar", attendance: "Present" },
                    { name: "Simran Kaur", attendance: "Absent" }
                ]
            }
        };

        let selectedProject = "campus";
        let feedbackHistory = [];

        function makeAttendanceTable(project) {
            const rows = project.members.map(function(member) {
                const status = member.attendance === "Present"
                    ? "present"
                    : "absent";

                return `
                    <tr>
                        <td>${member.name}</td>
                        <td class="${status}">${member.attendance}</td>
                    </tr>
                `;
            }).join("");

            return `
                <table>
                    <thead>
                        <tr>
                            <th>Member Name</th>
                            <th>Attendance</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function showPage(page, button) {
            const content = document.getElementById("content");

            document.querySelectorAll(".sidebar button").forEach(function(btn) {
                btn.classList.remove("active");
            });

            if (button) {
                button.classList.add("active");
            } else {
                const indexes = {
                    Dashboard: 0,
                    Projects: 1,
                    Students: 2,
                    Feedback: 3,
                    Profile: 4
                };

                if (indexes[page] !== undefined) {
                    document.querySelectorAll(".sidebar button")[indexes[page]]
                        .classList.add("active");
                }
            }

            if (page === "Dashboard") {
                content.innerHTML = `
                    <h1>Mentor Dashboard</h1>
                    <p class="welcome">
                        Select a project to view its individual statistics and team details.
                    </p>

                    <div class="card">
                        <label for="dashboardProject">Select Project</label>
                        <select id="dashboardProject"
                                onchange="updateDashboardProject()">
                            <option value="campus">Smart Campus Portal</option>
                            <option value="library">Library Management System</option>
                        </select>
                    </div>

                    <div id="projectStats" class="stats"></div>
                    <div id="dashboardProjectDetails"></div>
                `;

                document.getElementById("dashboardProject").value =
                    selectedProject;

                updateDashboardProject();

            } else if (page === "Projects") {
                content.innerHTML = `
                    <h1>Projects</h1>
                    <p class="welcome">
                        Select a project to view its leader, members and attendance.
                    </p>

                    <div class="card">
                        <label for="projectSelect">Select Project</label>
                        <select id="projectSelect" onchange="showProjectDetails()">
                            <option value="">Choose a project</option>
                            <option value="campus">Smart Campus Portal</option>
                            <option value="library">Library Management System</option>
                        </select>
                    </div>

                    <div id="projectDetails"></div>
                `;

                document.getElementById("projectSelect").value = selectedProject;
                showProjectDetails();

            } else if (page === "Students") {
                content.innerHTML = `
                    <h1>Student Teams</h1>
                    <p class="welcome">Team leaders and members for each project.</p>

                    ${Object.keys(projects).map(function(key) {
                        const project = projects[key];

                        return `
                            <div class="card">
                                <h3>${project.team}</h3>
                                <p><strong>Project:</strong> ${project.name}</p>
                                <p><strong>Team Leader:</strong> ${project.leader}</p>
                                <p><strong>Members:</strong></p>
                                <ul>
                                    ${project.members.map(function(member) {
                                        return `<li>${member.name}</li>`;
                                    }).join("")}
                                </ul>
                            </div>
                        `;
                    }).join("")}
                `;

            } else if (page === "Feedback") {
                content.innerHTML = `
                    <h1>Project Feedback</h1>
                    <p class="welcome">Provide feedback for a selected project.</p>

                    <div class="card">
                        <label for="feedbackProject">Select Project</label>
                        <select id="feedbackProject">
                            <option value="">Choose a project</option>
                            <option value="campus">Smart Campus Portal</option>
                            <option value="library">Library Management System</option>
                        </select>

                        <label for="feedback">Feedback</label>
                        <textarea id="feedback"
                            placeholder="Write feedback for the project"></textarea>

                        <button class="submit" onclick="giveFeedback()">
                            Submit Feedback
                        </button>

                        <p id="message" class="message"></p>
                        <div id="feedbackHistory"></div>
                    </div>
                `;

                document.getElementById("feedbackProject").value =
                    selectedProject;

                renderFeedbackHistory();

            } else if (page === "Profile") {
                content.innerHTML = `
                    <h1>My Profile</h1>
                    <p class="welcome">Your mentor information.</p>

                    <div class="card">
                        <h3>Personal Details</h3>
                        <div class="profile-row"><strong>Name:</strong> Mentor Name</div>
                        <div class="profile-row"><strong>Department:</strong> Computer Science</div>
                        <div class="profile-row"><strong>Email:</strong> mentor@example.com</div>
                        <div class="profile-row"><strong>Phone:</strong> 9876543210</div>
                    </div>
                `;
            }
        }

        function updateDashboardProject() {
            const key = document.getElementById("dashboardProject").value;
            const project = projects[key];

            if (!project) return;

            selectedProject = key;

            const total = project.members.length;
            const present = project.members.filter(function(member) {
                return member.attendance === "Present";
            }).length;
            const absent = total - present;

            document.getElementById("projectStats").innerHTML = `
                <div class="stat-card">
                    <h3>Total Members</h3>
                    <p>${total}</p>
                </div>
                <div class="stat-card">
                    <h3>Present Today</h3>
                    <p class="present">${present}</p>
                </div>
                <div class="stat-card">
                    <h3>Absent Today</h3>
                    <p class="absent">${absent}</p>
                </div>
                <div class="stat-card">
                    <h3>Interactions Done</h3>
                    <p>${project.completed}</p>
                </div>
                <div class="stat-card">
                    <h3>Pending Interactions</h3>
                    <p>${project.pending}</p>
                </div>
                <div class="stat-card">
                    <h3>Active Projects</h3>
                    <p>1</p>
                </div>
            `;

            document.getElementById("dashboardProjectDetails").innerHTML = `
                <div class="card">
                    <h3>${project.name}</h3>
                    <p><strong>Team:</strong> ${project.team}</p>
                    <p><strong>Team Leader:</strong> ${project.leader}</p>
                    <p><strong>Interaction:</strong> ${project.interaction}</p>
                    <p><strong>Interactions Completed:</strong> ${project.completed}</p>

                    <h3>Team Members and Attendance</h3>
                    ${makeAttendanceTable(project)}

                    <button class="action-button"
                        onclick="openFeedback('${key}')">
                        Give Feedback for This Project
                    </button>

                    <button class="action-button"
                        onclick="openProjects('${key}')">
                        View Project Details
                    </button>
                </div>
            `;
        }

        function showProjectDetails() {
            const selector = document.getElementById("projectSelect");
            const projectKey = selector.value;
            const details = document.getElementById("projectDetails");

            selectedProject = projectKey;

            if (!projectKey || !projects[projectKey]) {
                details.innerHTML = "";
                return;
            }

            const project = projects[projectKey];
            const present = project.members.filter(function(member) {
                return member.attendance === "Present";
            }).length;
            const absent = project.members.length - present;

            details.innerHTML = `
                <div class="card">
                    <h3>${project.name}</h3>
                    <p><strong>Team:</strong> ${project.team}</p>
                    <p><strong>Team Leader:</strong> ${project.leader}</p>
                    <p><strong>Interaction:</strong> ${project.interaction}</p>
                    <p><strong>Interactions Completed:</strong> ${project.completed}</p>
                    <p><strong>Attendance:</strong>
                        <span class="present">${present} present</span>,
                        <span class="absent">${absent} absent</span>
                    </p>

                    <h3>Team Members and Attendance</h3>
                    ${makeAttendanceTable(project)}

                    <button class="action-button"
                        onclick="openFeedback('${projectKey}')">
                        Give Feedback for This Project
                    </button>
                </div>
            `;
        }

        function openProjects(key) {
            selectedProject = key;
            showPage("Projects");
        }

        function openFeedback(key = selectedProject) {
            selectedProject = key;
            showPage("Feedback");
        }

        function giveFeedback() {
            const key = document.getElementById("feedbackProject").value;
            const feedback = document.getElementById("feedback").value.trim();
            const message = document.getElementById("message");

            if (!key || !feedback) {
                message.style.color = "#c44b4b";
                message.textContent =
                    "Please select a project and enter feedback.";
                return;
            }

            selectedProject = key;

            feedbackHistory.push({
                project: projects[key].name,
                text: feedback,
                date: new Date().toLocaleString()
            });

            document.getElementById("feedback").value = "";
            message.style.color = "#39804a";
            message.textContent =
                "Feedback added for " + projects[key].name + ".";

            renderFeedbackHistory();
        }

        function renderFeedbackHistory() {
            const container = document.getElementById("feedbackHistory");
            if (!container) return;

            const matchingFeedback = feedbackHistory.filter(function(item) {
                return item.project === projects[selectedProject]?.name;
            });

            if (matchingFeedback.length === 0) {
                container.innerHTML = "<p>No feedback submitted for this project in this session.</p>";
                return;
            }

            container.innerHTML = `
                <h3>Feedback Submitted This Session</h3>
                ${matchingFeedback.map(function(item) {
                    return `
                        <div class="profile-row">
                            <strong>${item.project}</strong>
                            <p>${escapeHtml(item.text)}</p>
                            <small>${item.date}</small>
                        </div>
                    `;
                }).join("")}
            `;
        }

        function escapeHtml(value) {
            return value.replace(/[&<>"']/g, function(char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }

        function logout() {
            window.location.href = "index.html";
        }

        showPage("Dashboard");
    </script>
</body>
</html>
